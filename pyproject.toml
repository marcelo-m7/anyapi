[project]
name = "anyapi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
 "flask>=3.1,<4",
 "gunicorn>=23,<24",
 "requests>=2.32,<3",
 "jsonschema>=4.23,<5",
 "pyyaml>=6,<7",
 "cryptography>=43,<47"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anyapi*", "endpoints*"]
