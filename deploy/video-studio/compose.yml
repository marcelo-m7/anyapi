services:
  web:
    build:
      context: ../..
      dockerfile: deploy/video-studio/Dockerfile
    env_file: ../../.env
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  worker:
    build:
      context: ../..
      dockerfile: deploy/video-studio/Dockerfile
    env_file: ../../.env
    command: ["python","-m","video_studio.worker"]
    restart: unless-stopped
