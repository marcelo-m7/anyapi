[project]
name = "odoo-mcp-saas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "requests>=2.32,<3",
  "cryptography>=46,<47",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_saas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
