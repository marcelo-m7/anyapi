<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Studio · AnyAPI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0a0d14;color:#ecf1fa}*{box-sizing:border-box}body{margin:0}header{height:66px;border-bottom:1px solid #273042;display:flex;align-items:center;justify-content:space-between;padding:0 26px}a{color:#8acaff}button,input,textarea,select{font:inherit;border:1px solid #354158;border-radius:9px;background:#141b29;color:#eef4ff;padding:10px}button{cursor:pointer}button.primary{background:#a4ddf7;border-color:#a4ddf7;color:#07131c;font-weight:700}button:hover{border-color:#92c5ed}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 310px;height:calc(100vh - 66px)}aside,.inspector{border-right:1px solid #263145;padding:20px;overflow:auto}.inspector{border-left:1px solid #263145;border-right:0}.main{padding:24px;overflow:auto}.muted{color:#a3b3cc;font-size:13px}.project{display:block;width:100%;text-align:left;margin:9px 0}.project.active{border-color:#82d4fd;background:#193247}.stage{display:grid;place-items:center;min-height:275px;border:1px solid #334056;border-radius:16px;background:radial-gradient(circle at 50% 30%,#27374d,#101722 65%);margin-top:15px;text-align:center}.stage img{max-width:100%;max-height:420px;border-radius:10px}.timeline{display:flex;gap:9px;overflow:auto;margin-top:18px;padding-bottom:14px}.clip{min-width:150px;max-width:180px;min-height:95px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.clip.active{border-color:#8cddff;background:#1c3549}.controls{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}textarea{min-height:120px;resize:vertical;width:100%}input,select{width:100%}.message{color:#ffc79b}h1{margin:0 0 7px;font-size:25px}h2{font-size:17px}@media(max-width:1050px){.layout{grid-template-columns:200px 1fr}.inspector{grid-column:1/-1;border-top:1px solid #334056}.layout{height:auto}.stage{min-height:220px}}@media(max-width:650px){.layout{display:block}aside,.inspector{border:0;border-bottom:1px solid #273042}header{padding:12px;gap:10px}.main{padding:15px}}
</style></head><body>
<header><strong>◈ AI Video Studio</strong><nav><a href="/dashboard">AnyAPI</a> · <a href="/video-studio">Estúdio</a></nav></header>
<div class="layout"><aside><h2>Projetos</h2><button class="primary" id="create">+ Novo documentário</button><div id="projects"></div><p class="muted">Espaço privado · PT-PT</p></aside>
<main><h1 id="projectTitle">Seleciona um projeto</h1><p class="muted" id="projectMeta">Editor de storyboard e timeline</p><div class="stage" id="preview"><span class="muted">Seleciona uma cena para pré-visualizar</span></div><div class="controls" style="margin-top:16px"><button id="add" disabled>+ Cena</button><button id="saveScript" disabled>Guardar roteiro</button><button id="manifest" disabled>Exportar manifest JSON</button></div><h2>Timeline · Cenas</h2><div class="timeline" id="timeline"></div><h2>Roteiro geral</h2><textarea id="script" placeholder="Escreve ou cola o roteiro do documentário..." disabled></textarea></main>
<section class="inspector"><h2>Inspector de cena</h2><p class="muted" id="selection">Seleciona uma cena na timeline.</p><label class="field">Título<input id="title" disabled></label><label class="field">Duração (segundos)<input type="number" min="1" max="120" id="duration" disabled></label><label class="field">Narração<textarea id="narration" disabled></textarea></label><label class="field">Prompt cinematográfico<textarea id="visual_prompt" disabled></textarea></label><label class="field">URL HTTPS de imagem/clip<input type="url" id="asset_url" disabled placeholder="https://..."></label><div class="controls"><button class="primary" id="saveScene" disabled>Guardar cena</button><button id="deleteScene" disabled>Eliminar</button></div><p id="msg" class="message" role="status"></p></section></div>
<script>
const csrf={{ csrf|tojson }};let projects=[],active=null,selected=null;const el=id=>document.getElementById(id);
async function api(path,method='GET',payload){const r=await fetch('/_api/video-studio'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:payload===undefined?undefined:JSON.stringify(payload)});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error?.message||'Erro HTTP '+r.status)}return r.status===204?null:r.json()}
function message(s){el('msg').textContent=s}
function enable(ids,on){ids.forEach(id=>el(id).disabled=!on)}
async function load(){projects=await api('/projects');el('projects').replaceChildren();projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(active?.id===p.id?' active':'');b.textContent=p.title;b.onclick=()=>openProject(p.id);el('projects').append(b)});}
async function openProject(id){active=await api('/projects/'+id);selected=null;el('projectTitle').textContent=active.title;el('projectMeta').textContent=active.format+' · '+active.language+' · '+active.scenes.length+' cenas';el('script').value=active.script||'';enable(['add','saveScript','manifest','script'],true);draw();load()}
function draw(){el('timeline').replaceChildren();active.scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='clip'+(selected?.id===s.id?' active':'');const t=document.createElement('strong');t.textContent=(i+1)+'. '+s.title;const d=document.createElement('small');d.textContent=s.duration_seconds+'s';b.append(t,d);b.onclick=()=>selectScene(s);el('timeline').append(b)});if(!active.scenes.length)el('timeline').textContent='Adiciona a primeira cena.';if(selected)selectScene(active.scenes.find(s=>s.id===selected.id)||null)}
function selectScene(s){selected=s;enable(['title','duration','narration','visual_prompt','asset_url','saveScene','deleteScene'],!!s);el('selection').textContent=s?'Cena '+(s.position+1):'Seleciona uma cena';for(const k of ['title','duration','narration','visual_prompt','asset_url'])el(k).value=s?(s[k==='duration'?'duration_seconds':k]??''):'';el('preview').replaceChildren();if(s?.asset_url){const img=document.createElement('img');img.src=s.asset_url;img.alt=s.title;img.onerror=()=>{el('preview').textContent='Pré-visualização indisponível para este asset.'};el('preview').append(img)}else el('preview').textContent=s?.visual_prompt||'Sem asset gerado';el('timeline').querySelectorAll('.clip').forEach((b,i)=>b.classList.toggle('active',active.scenes[i].id===s?.id))}
async function refresh(){const id=active.id;active=await api('/projects/'+id);draw();}
async function run(fn){try{message('');await fn()}catch(e){message(e.message)}}
el('create').onclick=()=>run(async()=>{const title=prompt('Título do novo episódio');if(!title)return;const p=await api('/projects','POST',{title,format:'both'});await load();await openProject(p.id)});
el('add').onclick=()=>run(async()=>{const s=await api('/projects/'+active.id+'/scenes','POST',{title:'Nova cena',duration_seconds:5});await refresh();selectScene(s)});
el('saveScript').onclick=()=>run(async()=>{await api('/projects/'+active.id,'PATCH',{script:el('script').value});message('Roteiro guardado.')});
el('saveScene').onclick=()=>run(async()=>{const values={title:el('title').value,duration_seconds:Number(el('duration').value),narration:el('narration').value,visual_prompt:el('visual_prompt').value,asset_url:el('asset_url').value||null};await api('/scenes/'+selected.id,'PATCH',values);await refresh();message('Cena guardada.')});
el('deleteScene').onclick=()=>run(async()=>{if(!confirm('Eliminar esta cena?'))return;await api('/scenes/'+selected.id,'DELETE');selected=null;await refresh();selectScene(null)});
el('manifest').onclick=()=>run(async()=>{const data=await api('/projects/'+active.id+'/manifest');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='video-manifest-'+active.id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),2000)});
load().catch(e=>message(e.message));
</script></body></html>
