<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | AnyAPI</title><style>body{background:#0d1018;color:#f6f7fb;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);background:#181d29;padding:30px;border:1px solid #343d50;border-radius:16px}input{display:block;width:96%;padding:12px;margin:8px 0 18px;border-radius:8px;border:1px solid #455063;background:#0d1018;color:white}button{padding:12px 20px;border-radius:8px;border:0;background:#9ae6ff;cursor:pointer}a{color:#9ae6ff}p{color:#afbad0}.error{color:#ff9da8}</style><main><a href="/">AnyAPI</a><h1>Create account</h1>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="{{ category }}">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" value="{{ form.username }}" pattern="[a-z0-9-]{3,}" required></label><label>Name<input name="display_name" value="{{ form.display_name }}"></label><label>Email<input type="email" name="email" value="{{ form.email }}" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button>Create account</button></form><p><a href="/login">Already registered?</a></p></main></html>
