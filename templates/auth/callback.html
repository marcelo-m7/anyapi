<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming your account | AnyAPI</title><style>body{background:#0d1018;color:#f6f7fb;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);background:#181d29;padding:30px;border:1px solid #343d50;border-radius:16px}input{display:block;width:96%;padding:12px;margin:8px 0 18px;border-radius:8px;border:1px solid #455063;background:#0d1018;color:white}button{padding:12px 20px;border-radius:8px;border:0;background:#9ae6ff;cursor:pointer}a{color:#9ae6ff}p{color:#afbad0}.error{color:#ff9da8}</style><main><a href="/">AnyAPI</a><h1>Confirming your account</h1>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="{{ category }}">{{ message }}</p>{% endfor %}<p id="message">Completing authentication…</p><script>const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has('access_token')){fetch('/auth/session',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':{{ csrf_token()|tojson }}},body:JSON.stringify(Object.fromEntries(fragment))}).then(r=>r.json()).then(d=>{if(d.redirect)location.replace(d.redirect);else document.getElementById('message').textContent='Could not complete sign in.'}).catch(()=>document.getElementById('message').textContent='Could not complete sign in.')}else{document.getElementById('message').textContent='The link is invalid or expired.'}</script></main></html>
