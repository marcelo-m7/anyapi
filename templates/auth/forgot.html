<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | AnyAPI</title><style>body{background:#0d1018;color:#f6f7fb;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);background:#181d29;padding:30px;border:1px solid #343d50;border-radius:16px}input{display:block;width:96%;padding:12px;margin:8px 0 18px;border-radius:8px;border:1px solid #455063;background:#0d1018;color:white}button{padding:12px 20px;border-radius:8px;border:0;background:#9ae6ff;cursor:pointer}a{color:#9ae6ff}p{color:#afbad0}.error{color:#ff9da8}</style><main><a href="/">AnyAPI</a><h1>Reset password</h1>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="{{ category }}">{{ message }}</p>{% endfor %}{% if sent %}<p>Check your inbox for a recovery link.</p>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required></label><button>Send recovery link</button></form>{% endif %}</main></html>
