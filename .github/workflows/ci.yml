name: AnyAPI CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: anyapi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
      - name: Python compile
        run: python -m compileall -q main.py anyapi endpoints
      - name: Browser JS syntax
        run: |
          for file in public/*.js; do node --check "$file"; done
      - name: Tests
        run: pytest -q
